<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
    <nav class="navbar px-4" style="background-color: white">
        <div class="rounded-4 p-2 d-flex align-items-center justify-content-center gap-4" style="background-color: white">
            <a href="landing-page.html" aria-label="Kembali ke halaman awal" class="text-decoration-none fw-bold fs-3 align-items-center" style="color: #0b1d33; line-height: 1">‹</a>
            <h2 class="fw-bold m-0 fs-3" style="line-height: 1">
                <span style="color: #0b1d33">Login</span>
            </h2>
        </div>
    </nav>

    <main style="color: #0b1d33">
        <div class="d-flex flex-column align-items-center gap-2">
            <div class="text-center mb-4">
                <img src="../img/login page/logo login.svg" alt="Logo Gorental" width="75" class="img-fluid" />
            </div>

            <header class="text-center">
                <h1 class="display-6 display-md-3 fw-bold mb-3">
                    Masuk ke Akun Anda
                </h1>
                <p class="text-secondary fs-6 mb-4" style="line-height: 1.6">
                    Selamat datang kembali! Silakan masuk untuk melanjutkan.
                </p>
            </header>

            <section style="max-width: 500px; width: 100%; margin: 0 auto">

                <!-- TAMBAHAN: Menambahkan id="loginForm" di tag form bawah ini agar bisa ditangkap JS -->
                <form id="loginForm">
                    <div class="mb-4 px-3">
                        <label for="login" class="form-label">Email / Nomor HP</label>
                        <input type="text" class="form-control" style="border-color: #0b1d33" id="login" placeholder="contoh@email.com" required />
                    </div>

                    <div class="mb-4 px-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" style="border-color: #0b1d33" id="password" name="password" placeholder="********" minlength="8" required />
                    </div>

                    <div class="d-grid gap-2 px-3">

                        <!-- TAMBAHAN: Menambahkan div kosong ini sebagai tempat munculnya teks error merah -->
                        <div id="errorMessage" class="text-danger text-center mb-2 d-none fw-medium fs-6"></div>

                        <!-- TAMBAHAN: Menambahkan id="loginBtn" di tag button bawah ini -->
                        <button id="loginBtn" class="btn text-white fw-bold py-2" type="submit" style="background-color: #0b1d33; border-color: #0b1d33">
                         Login
                        </button>
                    </div>
                </form>
            </section>

            <section class="mt-3">
                <p>Belum punya akun? <a href="daftar-akun.html">Daftar</a></p>
            </section>
        </div>
    </main>

    <!-- TAMBAHAN: Seluruh tag <script> di bawah ini adalah baru -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Menangkap nilai dari inputan
            const email = document.getElementById('login').value;
            const password = document.getElementById('password').value;

            // Menangkap elemen UI
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            // Mengubah teks tombol menjadi "Memuat..." saat diklik
            const originalBtnText = loginBtn.innerHTML;
            loginBtn.innerHTML = 'Memuat...';
            loginBtn.disabled = true;
            errorMessage.classList.add('d-none');

            setTimeout(() => {

                //  HAPUS NANTI: Mulai dari baris ini sampai batas hapus, ini cuma kode bohongan (dummy)
                const emailTersimpan = localStorage.getItem('akun_email');
                const passwordTersimpan = localStorage.getItem('akun_password');

                if (email === emailTersimpan && password === passwordTersimpan) {
                    window.location.href = 'beranda.html';
                } else {
                    errorMessage.textContent = 'Email atau password salah!';
                    errorMessage.classList.remove('d-none');
                    loginBtn.innerHTML = originalBtnText;
                    loginBtn.disabled = false;
                }
                //  BATAS HAPUS KODE BOHONGAN (DUMMY)


                /*  BUKA NANTI: Hapus simbol pembuka (/*) dan penutup ini nanti saat API Backend siap
                
                // Minta link API Login ke Irfan dan ganti tulisan 'URL_API_DARI_IRFAN' di bawah
                fetch('URL_API_DARI_IRFAN', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    
                    // Frontend cuma bertugas membungkus data form dan mengirimnya
                    body: JSON.stringify({ email: email, password: password })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        // Jika kata Backend (Database) datanya cocok
                        window.location.href = 'beranda.html';
                    } else {
                        // Jika kata Backend (Database) passwordnya salah
                        errorMessage.textContent = data.message; 
                        errorMessage.classList.remove('d-none');
                        loginBtn.innerHTML = originalBtnText;
                        loginBtn.disabled = false;
                    }
                })
                .catch(error => {
                    errorMessage.textContent = 'Terjadi kesalahan pada server!';
                    errorMessage.classList.remove('d-none');
                    loginBtn.innerHTML = originalBtnText;
                    loginBtn.disabled = false;
                });
                
                 BATAS BUKA NANTI */

            }, 1500);
        });
    </script>
</body>

</html>
