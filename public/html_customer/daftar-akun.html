<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body style="color: #0b1d33">
    <nav class="navbar px-4" style="background-color: white">
        <div class="rounded-4 p-2 d-flex align-items-center justify-content-center gap-4" style="background-color: white">
            <a href="landing-page.html" aria-label="Kembali ke halaman awal" class="text-decoration-none fw-bold fs-2 align-items-center" style="color: #0b1d33; line-height: 1">‹</a>
            <h2 class="fw-bold m-0 fs-4" style="line-height: 1">
                <span style="color: #0b1d33">Daftar Akun</span>
            </h2>
        </div>
    </nav>

    <main style="color: #0b1d33">
        <div class="d-flex flex-column align-items-center gap-2">
            <header>
                <h1 class="display-6 display-md-3 fw-bold mb-3">Daftar Akun</h1>
            </header>

            <section style="max-width: 500px; width: 100%; margin: 0 auto">

                <!--  TAMBAHAN 1: Menambahkan id="registerForm" di tag form ini -->
                <form id="registerForm">
                    <div class="mb-4 px-3">
                        <label for="nama" class="form-label">Nama Lengkap:</label>
                        <input type="text" class="form-control" style="border-color: #0b1d33" id="nama" name="nama" placeholder="Nama sesui KTP" required />
                    </div>

                    <div class="mb-4 px-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" style="border-color: #0b1d33" id="email" name="email" placeholder="contoh@gmail.com" required />
                    </div>

                    <div class="mb-4 px-3">
                        <label for="no" class="form-label">Nomor Handphone:</label>
                        <input type="tel" class="form-control" style="border-color: #0b1d33" id="no" name="no" placeholder="08xxxxxxxxxx" required />
                    </div>

                    <div class="mb-4 px-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" style="border-color: #0b1d33" id="password" name="password" placeholder="Minimal 8 karakter" minlength="8" required />
                    </div>

                    <div class="mb-4 px-3">
                        <label for="konfirmasi-password" class="form-label">Konfirmasi Password</label>

                        <!--  TAMBAHAN 2: Memastikan id nya persis "konfirmasi-password" -->
                        <input type="password" class="form-control" style="border-color: #0b1d33" id="konfirmasi-password" name="konfirmasi-password" placeholder="Ulangi password" minlength="8" required />
                    </div>

                    <div class="d-grid gap-2 px-3">

                        <!--  TAMBAHAN 3: Menambahkan div kosong ini untuk tempat munculnya tulisan sukses/error -->
                        <div id="messageBox" class="text-center mb-2 d-none fw-medium fs-6"></div>

                        <!--  TAMBAHAN 4: Menambahkan id="registerBtn" di tombol ini -->
                        <button id="registerBtn" class="btn text-white fw-bold py-2" type="submit" style="background-color: #0b1d33; border-color: #0b1d33"> Daftar </button>

                    </div>
                </form>
            </section>

            <section class="mt-3">
                <p>Sudah punya akun? <a href="login.html">Login</a></p>
            </section>
        </div>
    </main>

    <!--  TAMBAHAN 5: SEMUA BLOK SCRIPT DI BAWAH INI ADALAH KODE BARU -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Mengambil semua data yang diketik di form
            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const noHp = document.getElementById('no').value;
            const password = document.getElementById('password').value;
            const konfirmasi = document.getElementById('konfirmasi-password').value;

            const messageBox = document.getElementById('messageBox');
            const registerBtn = document.getElementById('registerBtn');

            // Validasi Frontend: Cek apakah password salah ketik
            if (password !== konfirmasi) {
                messageBox.textContent = 'Password dan Konfirmasi tidak cocok!';
                messageBox.className = 'text-danger text-center mb-2 fw-medium fs-6';
                return;
            }

            // Ubah tombol jadi "Memproses..."
            const originalText = registerBtn.innerHTML;
            registerBtn.innerHTML = 'Memproses...';
            registerBtn.disabled = true;
            messageBox.classList.add('d-none');

            /* ==============================================================================
               AREA BACKEND: GANTI KODE DI BAWAH INI NANTI SAAT API IRFAN SUDAH JADI 🚨
               ==============================================================================
               
               Nanti, kamu hapus kode "KODE SIMULASI" di bawah, lalu buka komentar kode Fetch 
               ini. Jangan lupa minta URL API yang benar ke Irfan (ganti 'URL_API_DARI_IRFAN').

               fetch('URL_API_DARI_IRFAN', {
                   method: 'POST',
                   headers: {
                       'Content-Type': 'application/json'
                   },
                   body: JSON.stringify({
                       nama: nama,
                       email: email,
                       no_hp: noHp,
                       password: password
                   })
               })
               .then(response => response.json())
               .then(data => {
                   if(data.status === 'success') {
                       messageBox.textContent = 'Pendaftaran berhasil! Mengarahkan ke Login...';
                       messageBox.className = 'text-success text-center mb-2 fw-medium fs-6';
                       setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                   } else {
                       messageBox.textContent = data.message; 
                       messageBox.className = 'text-danger text-center mb-2 fw-medium fs-6';
                       registerBtn.innerHTML = originalText;
                       registerBtn.disabled = false;
                   }
               })
               .catch(error => {
                   messageBox.textContent = 'Server error!';
                   messageBox.className = 'text-danger text-center mb-2 fw-medium fs-6';
                   registerBtn.innerHTML = originalText;
                   registerBtn.disabled = false;
               });

            ============================================================================== */


            // ⬇ HAPUS KODE SIMULASI INI NANTI KALAU SUDAH PAKAI FETCH API DI ATAS ⬇️
            setTimeout(() => {
                localStorage.setItem('akun_email', email);
                localStorage.setItem('akun_password', password);
                localStorage.setItem('akun_nama', nama);
                localStorage.setItem('akun_hp', noHp);

                messageBox.textContent = 'Pendaftaran berhasil! Mengarahkan ke Login...';
                messageBox.className = 'text-success text-center mb-2 fw-medium fs-6';

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            }, 1000);

        });
    </script>
</body>

</html>
